name: restore-pipewire-playback
on:
  push:
    branches: [cursor/pipewire-audio-f910]
    paths:
      - '.tmp-pipewire/READY'
permissions:
  contents: write
concurrency:
  group: restore-pipewire-playback
  cancel-in-progress: true
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/pipewire-audio-f910
      - name: Decode staged payloads into source files
        run: |
          set -euo pipefail
          python3 <<'PY'
          import base64, gzip, hashlib, pathlib, shutil
          tmp = pathlib.Path('.tmp-pipewire')
          if not (tmp / 'READY').exists():
              raise SystemExit('READY marker missing')
          jobs = [
              ('record.rs', 'crates/playback/src/record.rs', '8b0975043b53393dc676d6a1b51bdf5b'),
              ('lib.rs', 'crates/playback/src/lib.rs', 'a5d2b5ca867a80d119f595920f0bc869'),
              ('Cargo.lock', 'Cargo.lock', '26497d5921a38df7776acf5d8643b13b'),
          ]
          restored = []
          for prefix, target, expect_md5 in jobs:
              parts = sorted(tmp.glob(f'{prefix}.b64.*'))
              if not parts:
                  raise SystemExit(f'missing chunks for {prefix}')
              b64 = ''.join(p.read_text().strip() for p in parts)
              data = gzip.decompress(base64.b64decode(b64))
              got = hashlib.md5(data).hexdigest()
              if got != expect_md5:
                  raise SystemExit(f'md5 mismatch {target}: {got} != {expect_md5}')
              pathlib.Path(target).parent.mkdir(parents=True, exist_ok=True)
              pathlib.Path(target).write_bytes(data)
              print('restored', target, len(data), got)
              restored.append(target)
          if len(restored) != 3:
              raise SystemExit(f'expected 3 restores, got {restored}')
          shutil.rmtree(tmp)
          wf = pathlib.Path('.github/workflows/restore-pipewire-playback.yml')
          if wf.exists():
              wf.unlink()
          PY
      - name: Commit restored files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status
          git commit -m "feat(playback): adapt playback crate to cpal 0.18 + PipeWire"
          git push
